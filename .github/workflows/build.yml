name: Costruisci APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa gli strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython

      - name: Riusa i download delle volte precedenti
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Costruisci l'APK
        run: |
          yes | buildozer android debug > registro.txt 2>&1 || { echo "===== ERRORE: ULTIME RIGHE ====="; tail -n 150 registro.txt; exit 1; }
          tail -n 20 registro.txt

      - name: Salva il registro della costruzione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-costruzione
          path: registro.txt

      - name: Rendi scaricabile l'APK
        uses: actions/upload-artifact@v4
        with:
          name: PromemoriaMedicine-APK
          path: bin/*.apk
