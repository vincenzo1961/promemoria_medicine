name: Costruisci APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa gli strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython

      - name: Riusa i download delle volte precedenti
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Usa sempre la stessa firma (così gli aggiornamenti si installano senza perdere i dati)
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::Manca il segreto DEBUG_KEYSTORE (Settings > Secrets and variables > Actions > Repository secrets)."
            exit 1
          fi
          mkdir -p ~/.android
          # toglie spazi e "a capo" che il copia-incolla può aggiungere
          printf '%s' "$DEBUG_KEYSTORE" | tr -d ' \r\n\t' | base64 -d > ~/.android/debug.keystore 2>/dev/null || {
            echo "::error::Il testo del segreto DEBUG_KEYSTORE non è valido: incollalo di nuovo per intero."
            exit 1
          }
          echo "Firma caricata: $(wc -c < ~/.android/debug.keystore) byte"
          if ! keytool -list -keystore ~/.android/debug.keystore -storepass android > firma.txt 2>&1; then
            cat firma.txt
            echo "::error::Il segreto DEBUG_KEYSTORE è incompleto o rovinato: incollalo di nuovo per intero."
            exit 1
          fi
          grep -i "SHA" firma.txt || cat firma.txt

      - name: Costruisci l'APK
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/vincoli-pip.txt
        run: |
          echo "pip==25.3" > vincoli-pip.txt
          yes | buildozer android debug > registro.txt 2>&1 || { echo "===== ERRORE: ULTIME RIGHE ====="; tail -n 150 registro.txt; exit 1; }
          tail -n 20 registro.txt
          echo "Firma dell'APK (deve essere sempre la stessa):"
          keytool -printcert -jarfile bin/*.apk | grep -i "SHA256" || true

      - name: Salva il registro della costruzione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-costruzione
          path: registro.txt

      - name: Rendi scaricabile l'APK
        uses: actions/upload-artifact@v4
        with:
          name: PromemoriaMedicine-APK
          path: bin/*.apk
